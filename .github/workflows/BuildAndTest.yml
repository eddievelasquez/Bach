name: .NET

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo in the console output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience to skip caching NuGet packages and speed up the build
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry to Microsoft

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Restore dependencies
      run: dotnet restore Bach.slnx

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true

    - name: Build
      run: dotnet build Bach.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test Bach.slnx --configuration Release --no-build --verbosity normal --coverage --coverage-output "${{ github.workspace }}/.artifacts/coverage/coverage.xml" --coverage-output-format cobertura

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
      with:
        reports: ${{ github.workspace }}/.artifacts/coverage/coverage.xml
        targetdir: ${{ github.workspace }}/.artifacts/coverage/report
        reporttypes: Html;MarkdownSummaryGithub
        title: Bach coverage
        tag: ${{ github.run_number }}_${{ github.run_id }}

    - name: Publish coverage summary
      shell: pwsh
      run: |
        Get-Content "${{ github.workspace }}/.artifacts/coverage/report/SummaryGithub.md" |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

    - name: Verify coverage threshold
      shell: pwsh
      run: |
        [xml] $coverage = Get-Content "${{ github.workspace }}/.artifacts/coverage/coverage.xml"
        $lineRate = [double] $coverage.coverage.'line-rate'
        $threshold = 0.85

        if( $lineRate -lt $threshold )
        {
          throw "Line coverage $([math]::Round( $lineRate * 100, 2 ))% is below the required $([math]::Round( $threshold * 100, 2 ))%."
        }

        Write-Host "Line coverage: $([math]::Round( $lineRate * 100, 2 ))% (threshold: $([math]::Round( $threshold * 100, 2 ))%)."

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          .artifacts/coverage/coverage.xml
          .artifacts/coverage/report
